<style>
/* Layout: app mobile de uma coluna — barra superior, conteúdo em cartões, navegação fixa embaixo, cronômetro em tela cheia.
   Tema escuro é o padrão (grafite + verde-água), claro como alternativa. */
:root{

  --display:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --r-sm:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){

  --fg:#172025; --muted:#5d6a72; --accent:#0f8a63; --accent-ink:#ffffff; --accent-soft:rgba(15,138,99,.10);
  --blue:#2c67cc; --blue-soft:rgba(44,103,204,.10); --warn:#9a6a00; --warn-soft:rgba(186,132,0,.12);
  --orange:#b9581a; --orange-soft:rgba(185,88,26,.10); --violet:#5b4bc4; --danger:#c2302f; --danger-soft:rgba(194,48,47,.08);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f2; --surface:#ffffff; --surface-2:#f3f6f7; --line:#dbe1e4;
  --fg:#172025; --muted:#5d6a72; --accent:#0f8a63; --accent-ink:#ffffff; --accent-soft:rgba(15,138,99,.10);
  --blue:#2c67cc; --blue-soft:rgba(44,103,204,.10); --warn:#9a6a00; --warn-soft:rgba(186,132,0,.12);
  --orange:#b9581a; --orange-soft:rgba(185,88,26,.10); --violet:#5b4bc4; --danger:#c2302f; --danger-soft:rgba(194,48,47,.08);
  color-scheme:light}
*{box-sizing:border-box}

p{margin:0}

:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}

.steps{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.steps li{font-size:.86rem;color:var(--muted)}
.steps li::before{content:"·  "}
/* tabs */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}

#nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);min-height:58px}

/* mini bar */
.mini{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;border:0;width:100%;text-align:left;font-weight:700}
.mini .num{margin-left:auto;font-size:1.1rem}
/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;min-height:44px}
.switch input{width:48px;height:28px;appearance:none;background:var(--line);border-radius:99px;position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}

.picks{display:flex;gap:6px;flex-wrap:wrap}

.ed-row{display:grid;grid-template-columns:88px 70px 1fr 40px;gap:6px;align-items:center}
.ed-row input{min-height:42px;padding:8px}
.err{color:var(--danger);font-size:.88rem;font-weight:700}
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@media (min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

#focus{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.segi.past{opacity:.5}
.checks{display:flex;flex-direction:column;gap:6px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:.72rem;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:700;font-size:.86rem;min-width:0}

.cal button.full{background:var(--accent-soft)}
.cal .ind{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}

.xl{display:flex;gap:8px}.xl span{flex:1;text-align:center;font-size:.7rem;color:var(--muted);min-width:0}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr auto;gap:8px;align-items:center;font-size:.88rem}
.list{display:flex;flex-direction:column;gap:8px}
.li{padding:12px;border-radius:var(--r-sm);background:var(--surface-2);display:flex;flex-direction:column;gap:6px;min-width:0}

const listFor=k=>{const d=dow(k);return d===0?S.sunday:d===6?S.saturday:S.weekday};
function dayRec(k,create=true){if(!S.days[k]&&create){S.days[k]={plan:clone(listFor(k)),tasks:{},dur:{},rest:false,fired:{}};save()}return S.days[k]}
const durOf=(day,t)=>day.dur&&day.dur[t.id]!=null?day.dur[t.id]:t.dur;
const countable=day=>day.plan.filter(t=>!t.fixed);
function dayStats(day){if(!day)return{done:0,skip:0,pend:0,total:0,pct:0};const c=countable(day);let done=0,skip=0;
 for(const t of c){const s=day.tasks[t.id];if(s&&s.status==='done')done++;else if(s)skip++}
 return{done,skip,pend:c.length-done-skip,total:c.length,pct:c.length?Math.round(done/c.length*100):0}}
const dayFull=day=>{const s=dayStats(day);return s.total>0&&s.pct>=60};

function activeStartMin(){if(!S.active)return null;const d=new Date(S.active.startedAt);const p={};for(const x of fmtParts.formatToParts(d))p[x.type]=x.value;return(+p.hour%24)*60+ +p.minute}
function schedule(k){
 const day=dayRec(k);const n=nowP();const isToday=k===n.key;const now=isToday?n.min:-1;
 let cursor=null,firstPending=true;const out=[];let overflow=null;
 for(const t of day.plan){
  const st=day.tasks[t.id];const sched=toMin(t.start);const dur=durOf(day,t);let proj=sched;
  const isAct=S.active&&S.active.date===k&&S.active.taskId===t.id;
  if(t.fixed){ if(S.mode==='flex'&&cursor!=null&&cursor>sched&&!overflow)overflow={task:t,by:cursor-sched}; }
  else if(st){ if(st.status==='done'&&st.doneAt!=null)cursor=Math.max(cursor??0,st.doneAt); proj=st.startMin??sched; }
  else if(S.mode==='flex'){
   if(isAct){proj=activeStartMin()??sched;}
   else if(firstPending){proj=Math.max(sched,cursor??sched,now);}
   else proj=Math.max(sched,cursor??sched);
   cursor=proj+dur;firstPending=false;
  }
  out.push({t,st,sched,proj,dur,isAct});
 }
 return{day,items:out,overflow};
}
function nextItem(k){const sc=schedule(k);return sc.items.find(i=>i.isAct)||sc.items.find(i=>!i.t.fixed&&!i.st)||null}

 const studyMin=st.reduce((a,s)=>a+(+s.min||0),0);const q=st.reduce((a,s)=>a+(+s.q||0),0);const c=st.reduce((a,s)=>a+(+s.c||0),0);
 const woMin=wo.reduce((a,w)=>a+(+w.actual||0),0);let tDone=0,tTot=0,full=0;
 for(let i=0;i<7;i++){const d=S.days[addDays(ws,i)];if(d){const s=dayStats(d);tDone+=s.done;tTot+=s.total;if(dayFull(d))full++}}
 return{ws,we,studyMin,q,c,woMin,woN:wo.length,tDone,tTot,full,goalMet:studyMin>=S.goals.studyH*60}}

function elapsedSec(a=S.active){if(!a)return 0;const end=a.pausedAt||Date.now();return Math.max(0,(end-a.startedAt-(a.pausedTotal||0))/1000)}
function remaining(){const a=S.active;return a?a.planned*60-elapsedSec():0}
function startTimer(opts){if(S.active&&!S.active.pausedAt&&S.active.taskId!==opts.taskId){openModal(confirmSwitch(opts));return}
 S.active=Object.assign({startedAt:Date.now(),pausedAt:null,pausedTotal:0,warned:false,ended:false,seg:0,checked:[]},opts);save();openFocus();wakeOn();syncTimerNotifs()}
function confirmSwitch(opts){window.__pendingStart=opts;return`<h2>Trocar de atividade?</h2><p>“${esc(S.active.name)}” ainda está rodando. O tempo dela será salvo como feito até aqui.</p><div class="btns"><button class="btn" data-act="closeModal">Continuar a atual</button><button class="btn primary" data-act="switchConfirm">Trocar</button></div>`}
function startTask(id,overrideMin){const k=today(),day=dayRec(k),t=day.plan.find(x=>x.id===id);if(!t)return;
 if(overrideMin){day.dur[id]=overrideMin}
 const isStudy=t.cat==='estudo';startTimer({date:k,taskId:id,name:t.name,planned:durOf(day,t),kind:isStudy?'study':t.cat==='treino'?'treino':'routine',steps:t.steps||[],split:isStudy?scaleSplit(durOf(day,t)):null,startMin:nowP().min})}
function scaleSplit(total){const base=S.split.reduce((a,s)=>a+s.min,0)||1;if(base===total)return clone(S.split);
 let acc=0;const out=S.split.map((s,i)=>{const m=i===S.split.length-1?total-acc:Math.max(1,Math.round(s.min*total/base));acc+=m;return{label:s.label,min:m}});return out}
function openFocus(){renderFocus();$('#focus').hidden=false;document.body.style.overflow='hidden'}
function closeFocus(){$('#focus').hidden=true;document.body.style.overflow='';render()}
const C=2*Math.PI*90;
function renderFocus(){const a=S.active,f=$('#focus');if(!a){f.hidden=true;return}
 const k=a.date,sc=a.taskId?schedule(k):null;const idx=sc?sc.items.findIndex(i=>i.t.id===a.taskId):-1;const after=sc?sc.items.slice(idx+1).find(i=>!i.st):null;
 let segs='';if(a.split){let acc=0;segs='<div class="segs" data-live="segs">'+a.split.map((s,i)=>{const st=acc;acc+=s.min;return`<div class="segi" data-seg="${i}" data-from="${st}" data-to="${acc}"><span class="num" style="width:42px">${s.min}′</span><span class="grow">${esc(s.label)}</span></div>`}).join('')+'</div>'}
 const steps=a.steps&&a.steps.length?'<div class="checks">'+a.steps.map((s,i)=>`<label><input type="checkbox" data-act="stepChk" data-i="${i}" ${a.checked&&a.checked.includes(i)?'checked':''}>${esc(s)}</label>`).join('')+'</div>':'';
 f.innerHTML=`<div class="in">
 <div class="row between"><button class="icon-btn" data-act="closeFocus" aria-label="Minimizar">${I.back}</button><span class="label">${a.kind==='study'?'Estudo':a.kind==='treino'?'Movimento':'Rotina'}${a.taskId?' · '+hhmm(toMin((sc&&sc.items[idx]?sc.items[idx].t.start:'0:0'))):''}</span><span style="width:44px"></span></div>
 <h1 style="text-align:center">${esc(a.name)}</h1>
 <div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="12"/><circle data-live="arc" cx="100" cy="100" r="90" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>
 <div class="center"><div class="clock" data-live="clock">--:--</div><div class="small muted" data-live="sub">de ${fmtDur(a.planned)}</div></div></div>
 <div data-live="msg"></div>
 ${segs}${steps}
 <div class="btns" data-live="ctrl"></div>
 <div class="btns"><button class="btn" data-act="extend">+5 min</button><button class="btn ghost" data-act="${a.taskId?'skip':'cancelTimer'}" data-id="${a.taskId||''}">${a.taskId?'Pular':'Cancelar'}</button></div>
 ${after?`<p class="small muted" style="text-align:center">Depois: <b>${esc(after.t.name)}</b> (${fmtDur(after.dur)})</p>`:''}
 </div>`;
 updateFocus(true)}
function updateFocus(force){const a=S.active;if(!a)return;const r=remaining(),el=elapsedSec(),f=$('#focus');
 const mini=document.querySelector('[data-live="mini"]');if(mini)mini.textContent=mmss(r);
 // avisos (rodam mesmo com a tela minimizada)
 if(!a.pausedAt){
  if(!a.warned&&S.warnBefore>0&&r<=S.warnBefore*60&&r>0&&a.planned>S.warnBefore){a.warned=true;save();if(!nativeOK()){chime('warn');buzz()}toast(`Faltam ${S.warnBefore} min. Vá encerrando com calma.`)}
  if(!a.ended&&r<=0){a.ended=true;save();if(!nativeOK()){chime('end');buzz();sysNotify('Tempo previsto terminou',a.name)}toast('Tempo previsto terminou. Pode concluir ou pegar mais 5 min.')}
  if(a.split){let acc=0,cur=0;const em=el/60;for(let i=0;i<a.split.length;i++){if(em>=acc)cur=i;acc+=a.split[i].min}
   if(cur!==a.seg){a.seg=cur;save();if(!nativeOK()){chime('warn');buzz()}toast('Agora: '+a.split[cur].label)}}
 }
 if(f.hidden)return;
 const clock=f.querySelector('[data-live="clock"]');if(!clock)return;
 clock.textContent=mmss(r);clock.classList.toggle('over',r<0);
 const frac=clamp(el/(a.planned*60),0,1);f.querySelector('[data-live="arc"]').setAttribute('stroke-dashoffset',String(C*frac));
 f.querySelector('[data-live="arc"]').setAttribute('stroke',r<0?'var(--warn)':'var(--accent)');
 f.querySelector('[data-live="sub"]').textContent=r<0?'além do previsto':a.pausedAt?'pausado':'restantes de '+fmtDur(a.planned);
 if(a.split){const em=el/60;f.querySelectorAll('.segi').forEach(s=>{const fr=+s.dataset.from,to=+s.dataset.to;s.classList.toggle('now',em>=fr&&em<to||(em>=to&&+s.dataset.seg===a.split.length-1));s.classList.toggle('past',em>=to&&+s.dataset.seg!==a.split.length-1)})}
 const ctrl=f.querySelector('[data-live="ctrl"]');const state=a.pausedAt?'p':'r';
 if(force||ctrl.dataset.s!==state){ctrl.dataset.s=state;ctrl.innerHTML=(a.pausedAt?`<button class="btn big" data-act="resume">${I.play} Continuar</button>`:`<button class="btn big" data-act="pause">Pausar</button>`)+`<button class="btn primary big" data-act="finish">${I.check} Concluir</button>`}
 const msg=f.querySelector('[data-live="msg"]');const ms=r<0?'<div class="banner info"><span><b>Tempo previsto terminou.</b> Sem problema. Conclua quando estiver pronto.</span></div>':'';
 if(msg.dataset.m!==String(r<0)){msg.dataset.m=String(r<0);msg.innerHTML=ms}
}

 if(a.taskId){const day=dayRec(a.date);day.tasks[a.taskId]={status:'done',actual:mins,doneAt:a.date===n.key?n.min:null,startMin:a.startMin}}
 const kind=a.kind,taskId=a.taskId,date=a.date;S.active=null;save();wakeOff();syncTimerNotifs();

 if(s===1){const arr=toMin(onb.arrive),sleepStart=arr+150,dur=((toMin(onb.wake)-sleepStart)%1440+1440)%1440;
  h+=`<h1>Seus horários</h1><p class="muted">A rotina noturna começa quando você chega em casa.</p><div class="grid2"><div class="field"><label for="o-arr">Chego em casa às</label><input id="o-arr" type="time" value="${onb.arrive}" data-act-change="onb"></div><div class="field"><label for="o-wake">Acordo às</label><input id="o-wake" type="time" value="${onb.wake}" data-act-change="onb"></div></div>
  <div class="card"><p>Dormir às <b class="num">${hhmm(sleepStart)}</b> → <b>${fmtDur(dur)}</b> de sono.</p>${dur<480?'<p class="small muted">7h é o mínimo para adultos, e muita gente precisa de 8h. Se acordar cansado, ajuste depois em Ajustes.</p>':''}</div>
  <div class="btns"><button class="btn" data-act="onbBack">Voltar</button><button class="btn primary" data-act="onbNext">Continuar</button></div>`}
 if(s===2)h+=`<h1>Se algo atrasar…</h1><div class="stack"><button class="card" data-act="onbMode" data-v="flex" style="text-align:left;${onb.mode==='flex'?'border-color:var(--accent)':''}"><b>Modo flexível</b><span class="small muted">As próximas etapas se ajustam sozinhas. O horário de dormir é mantido.</span></button><button class="card" data-act="onbMode" data-v="fixed" style="text-align:left;${onb.mode==='fixed'?'border-color:var(--accent)':''}"><b>Horário fixo</b><span class="small muted">Os horários não mudam. O app avisa o atraso e você decide.</span></button></div><div class="btns"><button class="btn" data-act="onbBack">Voltar</button><button class="btn primary" data-act="onbNext">Continuar</button></div>`;
 if(s===3){const list=shiftWeekday(defaultRoutines().weekday);h+=`<h1>Confira sua rotina de semana</h1><div class="tl">${list.map(t=>`<div class="ti"><div class="t">${t.start}</div><div><div class="nm"><span class="cat c-${t.cat}"></span>${esc(t.name)}</div><div class="small muted">${fmtDur(t.dur)}</div></div></div>`).join('')}</div>
  <p class="small muted">Os dados ficam salvos só neste aparelho. ${LN?'Na próxima tela, permita as notificações para receber os avisos com o app fechado.':'Os lembretes aparecem com o app aberto.'}</p><div class="btns"><button class="btn" data-act="onbBack">Voltar</button><button class="btn primary" data-act="onbDone">Começar</button></div>`}
 return h+'</div>'}
function shiftWeekday(list){const off=toMin(onb.arrive)-toMin(list[0].start);list.forEach(t=>t.start=hhmm(toMin(t.start)+off));const sl=list.find(t=>t.cat==='sono');if(sl){let d=((toMin(onb.wake)-toMin(sl.start))%1440+1440)%1440;sl.dur=d||420}return list}

/* ---------- modal ---------- */
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;setTimeout(()=>{const f=m.querySelector('input:not([readonly]),select,textarea,button');f&&f.focus({preventScroll:true})},50)}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
function skipForm(id){const day=dayRec(today()),t=day.plan.find(x=>x.id===id);return`<h2>Pular “${esc(t?t.name:'')}”</h2><p class="small muted">Tudo bem. Imprevistos acontecem. Quer anotar o motivo? (opcional)</p>
 <div class="picks" id="sk-picks">${['Imprevisto','Cansaço','Sem energia','Atrasei','Fiz outra coisa'].map(r=>`<button class="pick" data-act="pickReason" data-v="${r}" aria-pressed="false">${r}</button>`).join('')}</div>
 <input id="sk-text" type="text" placeholder="Outro motivo">
 <div class="btns"><button class="btn" data-act="doSkip" data-id="${id}" data-s="postponed">Deixar para depois</button><button class="btn primary" data-act="doSkip" data-id="${id}" data-s="skipped">Pular hoje</button></div><button class="btn ghost" data-act="closeModal">Cancelar</button>`}

/* ---------- export ---------- */
function toCSV(){const rows=[['tipo','data','atividade_ou_materia','assunto','previsto_min','realizado_min','status','questoes','acertos','intensidade','observacoes']];
 for(const[k,d]of Object.entries(S.days).sort())for(const t of d.plan.filter(t=>!t.fixed)){const x=d.tasks[t.id];rows.push(['rotina',k,t.name,'',durOf(d,t),x&&x.actual||'',x?x.status:'pendente','','','',x&&x.reason||''])}
 for(const s of S.studies)rows.push(['estudo',s.date,s.subject,s.topic,'',s.min,s.finished?'conteudo_visto':'','' +(s.q||''),''+(s.c||''),'',s.doubts||'']);
 for(const w of S.workouts)rows.push(['movimento',w.date,w.type,'',w.planned,w.actual,'','','',w.intensity,w.notes||'']);
 for(const e of S.errors)rows.push(['erro',e.date,e.subject,e.topic,'','',e.resolved?'resolvido':'pendente','','','',e.text]);
 return rows.map(r=>r.map(v=>{v=String(v??'');return/[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\n')}

/* ---------- ações ---------- */
const A={
 go:d=>{view=d.v;draft=null;closeModal();render();window.scrollTo(0,0)},
 rotTab:d=>{sub.rot=d.t;render()},histTab:d=>{sub.hist=d.t;render()},setTab:d=>{sub.setTab=d.t;draft=null;render()},
 start:d=>{closeModal();startTask(d.id)},
 shrinkStart:d=>startTask(d.id,+d.min),
 shrink:d=>{dayRec(today()).dur[d.id]=+d.min;save();toast('Etapa encurtada para '+d.min+' min.');render()},
 quickDone:d=>{const k=today(),day=dayRec(k),t=day.plan.find(x=>x.id===d.id);day.tasks[d.id]={status:'done',actual:durOf(day,t),doneAt:nowP().min};save();toast('Etapa concluída! Agora é hora de começar a próxima.');render();
  if(t.cat==='estudo')openModal(studyForm({min:durOf(day,t)}));else if(t.cat==='treino')openModal(workoutForm({actual:durOf(day,t)}))},
 skip:d=>openModal(skipForm(d.id)),
 pickReason:(d,b)=>{const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on))},
 doSkip:d=>{const reasons=[...document.querySelectorAll('#sk-picks [aria-pressed="true"]')].map(b=>b.dataset.v);const t=$('#sk-text').value.trim();if(t)reasons.push(t);
  const day=dayRec(today());day.tasks[d.id]={status:d.s,reason:reasons.join(', ')};if(S.active&&S.active.taskId===d.id){S.active=null;wakeOff();syncTimerNotifs();$('#focus').hidden=true;document.body.style.overflow=''}
  save();closeModal();toast(d.s==='postponed'?'Adiado. Quando der, você retoma.':'Tudo bem. Siga para a próxima.');render()},
 undo:d=>{delete dayRec(today()).tasks[d.id];save();render()},
 openFocus:()=>openFocus(),closeFocus:()=>closeFocus(),
 pause:()=>{S.active.pausedAt=Date.now();save();updateFocus(true);syncTimerNotifs()},
 resume:()=>{const a=S.active;a.pausedTotal+=Date.now()-a.pausedAt;a.pausedAt=null;save();updateFocus(true);wakeOn();syncTimerNotifs()},
 finish:()=>finishActive(),
 extend:()=>{S.active.planned+=5;S.active.ended=false;S.active.warned=false;save();renderFocus();syncTimerNotifs();toast('Mais 5 minutos.')},
 cancelTimer:()=>{S.active=null;save();wakeOff();syncTimerNotifs();closeFocus()},
 stepChk:(d,b)=>{const a=S.active;a.checked=a.checked||[];const i=+d.i;if(b.checked)a.checked.push(i);else a.checked=a.checked.filter(x=>x!==i);save()},
 switchConfirm:()=>{const o=window.__pendingStart;closeModal();if(S.active.taskId){const n=nowP();dayRec(S.active.date).tasks[S.active.taskId]={status:'done',actual:Math.max(1,Math.round(elapsedSec()/60)),doneAt:n.min}}S.active=null;startTimer(o)},
 studyNow:d=>{const k=today(),day=dayRec(k);const t=day.plan.find(x=>x.study&&!day.tasks[x.id]);
  if(t&&!d.s){startTask(t.id);return}const min=S.split.reduce((a,s)=>a+s.min,0)||40;
  startTimer({date:k,taskId:t?t.id:null,name:d.s?'Estudo: '+d.s:'Sessão de estudo',planned:t?durOf(day,t):min,kind:'study',steps:[],split:scaleSplit(t?durOf(day,t):min),subject:d.s||null,startMin:nowP().min})},
 startWorkout:()=>{const k=today(),day=dayRec(k);const t=day.plan.find(x=>x.cat==='treino'&&!day.tasks[x.id]);if(t){startTask(t.id);return}
  startTimer({date:k,taskId:null,name:S.plan[dow(k)]||'Movimento',planned:45,kind:'treino',steps:[],split:null,startMin:nowP().min})},
 logStudy:d=>openModal(studyForm({subject:d.s})),
 saveStudy:d=>{const min=+$('#f-min').value,q=+$('#f-q').value||0,c=+$('#f-c').value||0,err=$('#f-err');
  if(!(min>0)){err.textContent='Informe quantos minutos você estudou.';err.hidden=false;return}if(c>q){err.textContent='Os acertos não podem passar do número de questões.';err.hidden=false;return}
  const subj=$('#f-subj').value,topic=$('#f-topic').value.trim(),date=d.date||today();
  S.studies.push({id:uid(),ts:Date.now(),date,subject:subj,topic,min,q,c,doubts:$('#f-doubts').value.trim(),finished:$('#f-fin').checked});
  $('#f-errs').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(text=>S.errors.push({id:uid(),date,subject:subj,topic,text,why:'',resolved:false,tries:0}));
  if($('#f-fin').checked)S.reviews.push({id:uid(),subject:subj,topic,created:date,stage:0,due:addDays(date,1),doneAll:false});
  save();closeModal();toast('Estudo registrado.');render()},
 delStudy:d=>{S.studies=S.studies.filter(s=>s.id!==d.id);save();render()},
 addError:()=>openModal(errorForm()),
 saveError:()=>{const text=$('#e-text').value.trim();if(!text){const e=$('#e-err');e.textContent='Descreva a questão ou o ponto que errou.';e.hidden=false;return}
  S.errors.push({id:uid(),date:today(),subject:$('#e-subj').value,topic:$('#e-topic').value.trim(),text,why:$('#e-why').value.trim(),resolved:false,tries:0});save();closeModal();toast('Erro anotado.');render()},
 errOk:d=>{const e=S.errors.find(x=>x.id===d.id);e.resolved=true;e.resolvedAt=today();save();toast('Boa! Erro resolvido.');render()},
 errAgain:d=>{const e=S.errors.find(x=>x.id===d.id);e.tries=(e.tries||0)+1;save();toast('Normal. Ele fica aqui para a próxima revisão.');render()},
 revDone:d=>{const r=S.reviews.find(x=>x.id===d.id);const gaps=[1,7,30];r.stage++;if(r.stage>=gaps.length)r.doneAll=true;else r.due=addDays(today(),gaps[r.stage]-gaps[r.stage-1]);save();toast('Revisão feita.');render()},
 logWorkout:()=>openModal(workoutForm()),
 pickInt:(d,b)=>{b.parentElement.querySelectorAll('.pick').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))},
 saveWorkout:d=>{const act=+$('#w-act').value,pl=+$('#w-plan').value||45;if(!(act>0)){const e=$('#w-err');e.textContent='Informe quantos minutos você fez.';e.hidden=false;return}
  const int=+(document.querySelector('#w-int [aria-pressed="true"]')||{dataset:{v:2}}).dataset.v;
  S.workouts.push({id:uid(),ts:Date.now(),date:d.date||today(),type:$('#w-type').value,planned:pl,actual:act,intensity:int,notes:$('#w-notes').value.trim()});save();closeModal();toast('Movimento registrado. Conta sim!');render()},
 delWorkout:d=>{S.workouts=S.workouts.filter(w=>w.id!==d.id);save();render()},
 addType:()=>{const v=$('#newType').value.trim();if(!v)return;if(!S.types.includes(v))S.types.push(v);save();render();toast('Atividade adicionada.')},
 calNav:d=>{const m=sub.calMonth||today().slice(0,7);const dt=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7)-1+ +d.n,1));sub.calMonth=dt.toISOString().slice(0,7);render()},
 weekNav:d=>{sub.weekOf=addDays(sub.weekOf||weekStart(today()),+d.n);render()},
 dayDetail:d=>openModal(dayDetail(d.k)),
 toggleRest:d=>{const r=dayRec(d.k);r.rest=!r.rest;save();openModal(dayDetail(d.k));render()},
 closeModal:()=>closeModal(),
 theme:d=>{S.theme=d.v;save();render()},mode:d=>{S.mode=d.v;save();render()},
 testNative:async()=>{try{await LN.schedule({notifications:[{id:9500,channelId:CH,title:'Teste da Rotina',body:'Se você está vendo isto com a tela bloqueada, os avisos funcionam.',schedule:{at:new Date(Date.now()+60000),allowWhileIdle:true}}]});toast('Agora bloqueie o celular. O aviso chega em 1 minuto.')}catch(e){toast('Não consegui agendar: '+(e&&e.message||e))}},
 askNative:async()=>{await nativeInit(true);render();toast(nativePerm==='granted'?'Avisos ativados.':'Permita em Configurações do Android → Apps → Rotina do Gabriel.')},
 askNotif:async()=>{try{const p=await Notification.requestPermission();toast(p==='granted'?'Notificações permitidas.':'O navegador não permitiu. Os lembretes continuam na tela do app.')}catch(e){toast('Este ambiente não permite notificações. Os lembretes continuam na tela do app.')}render()},
 edAdd:()=>{const l=draft.list;const last=l.filter(t=>!t.fixed).slice(-1)[0];l.push({id:uid(),start:last?hhmm(toMin(last.start)+last.dur):'09:00',dur:15,name:'Nova etapa',cat:'casa',steps:[]});$('#editor').innerHTML=editorHTML(draft.tab)},
 edDel:d=>{draft.list.splice(+d.i,1);$('#editor').innerHTML=editorHTML(draft.tab)},
 edSave:()=>{const v=validate(draft.list),e=$('#edErr');if(v.errs.length){e.innerHTML=v.errs.map(esc).join('<br>');e.hidden=false;return}
  S[draft.tab]=v.sorted;refreshTodayPlan(draft.tab);draft=null;save();syncNativeReminders();toast('Horários salvos.');render()},
 restore:()=>{openModal(`<h2>Restaurar rotina padrão?</h2><p>Os horários voltam ao modelo original. Seu histórico, estudos e treinos continuam salvos.</p><div class="btns"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="restoreYes">Restaurar</button></div>`)},
 restoreYes:()=>{const r=defaultRoutines();for(const t of ['weekday','saturday','sunday']){S[t]=r[t];refreshTodayPlan(t)}S.split=clone(DEF_SPLIT);draft=null;save();syncNativeReminders();closeModal();toast('Rotina padrão restaurada.');render()},
 splitAdd:()=>{S.split.push({label:'Nova etapa',min:5});save();render()},
 splitDel:d=>{if(S.split.length<=1)return;S.split.splice(+d.i,1);save();render()},
 saveSubjects:()=>{const l=$('#s-subj').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!l.length){toast('Deixe pelo menos uma matéria.');return}S.subjects=[...new Set(l)];save();toast('Matérias salvas.');render()},
 goal:d=>{const k=d.k,min={studyH:1,workouts:1,questions:10}[k],max={studyH:40,workouts:14,questions:1000}[k];S.goals[k]=clamp(Math.round((S.goals[k]+ +d.d)*10)/10,min,max);save();render()},
 export:d=>{const txt=d.f==='json'?JSON.stringify(S,null,1):toCSV();const out=$('#exportOut');
  out.innerHTML=`<div class="stack" style="margin-top:8px"><pre class="out" id="exTxt">${esc(txt)}</pre><button class="btn sm" data-act="copyEx">Copiar ${d.f.toUpperCase()}</button><p class="tiny muted">Cole num arquivo de texto ou no Google Drive para guardar. ${d.f==='csv'?'Separador: ponto e vírgula (abre direto no Excel/Planilhas em português).':''}</p></div>`},
 copyEx:async()=>{const t=$('#exTxt').textContent;try{await navigator.clipboard.writeText(t);toast('Copiado.')}catch(e){const r=document.createRange();r.selectNodeContents($('#exTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado. Use “Copiar” do celular.')}},
 erase:()=>{if($('#s-erase').value.trim().toUpperCase()!=='APAGAR'){toast('Digite APAGAR para confirmar.');return}try{localStorage.removeItem(KEY)}catch(e){}cancelRange(1000,9099);S=defaults();onb={step:0,name:'Gabriel',arrive:'19:30',wake:'05:00',mode:'flex'};view='home';saveNow();toast('Dados apagados.');render()},
 onbNext:()=>{if(onb.step===0){const n=$('#o-name').value.trim();onb.name=n||'Gabriel'}onb.step++;render()},
 onbBack:()=>{onb.step--;render()},
 onbMode:d=>{onb.mode=d.v;render()},
 onbDone:()=>{S.name=onb.name;S.mode=onb.mode;S.weekday=shiftWeekday(defaultRoutines().weekday);S.setupDone=true;const k=today();if(S.days[k])S.days[k].plan=clone(listFor(k));save();view='home';render();toast('Pronto! Comece pela próxima etapa.');nativeInit(true)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT'||(b.tagName==='INPUT'&&b.type!=='checkbox'))return;const f=A[b.dataset.act];if(f){if(b.tagName!=='INPUT')e.preventDefault();f(b.dataset,b)}});
document.addEventListener('change',e=>{const el=e.target,act=el.dataset.actChange;if(!act)return;const d=el.dataset;
 if(act==='set'){S[d.k]=el.checked;save();if(d.k==='calm')applyTheme();if(d.k==='wake'&&!el.checked)wakeOff();toast('Salvo.')}
 else if(act==='name'){S.name=el.value.trim()||'Gabriel';save();toast('Salvo.')}
 else if(act==='warn'){S.warnBefore=+el.value;save();syncTimerNotifs();toast('Salvo.')}
 else if(act==='notif'){S.notif[d.k]=el.checked;save();syncNativeReminders();toast('Salvo.')}
 else if(act==='plan'){S.plan[d.d]=el.value==='__none'?'':el.value;save();toast('Plano atualizado.')}
 else if(act==='split'){const s=S.split[+d.i];if(d.f==='min')s.min=Math.max(1,+el.value||1);else s.label=el.value.trim()||s.label;save();render()}
 else if(act==='ed'){const t=draft.list[+d.i];if(d.f==='dur')t.dur=+el.value;else t[d.f]=el.value}
 else if(act==='onb'){onb.arrive=$('#o-arr').value||onb.arrive;onb.wake=$('#o-wake').value||onb.wake;render()}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(!$('#focus').hidden)closeFocus()}});

/* ---------- lembretes ---------- */
const RMSG={jantar:'Hora do jantar',treino:'Hora de se mexer',estudo:'Hora de estudar',revisao:'Revisão semanal',dormir:'Hora de preparar para dormir'};
const wantsRemind=t=>!t.fixed&&(t.remind?!!S.notif[t.remind]:S.notif.outras!==false);
const rTitle=t=>RMSG[t.remind]||('Hora de: '+t.name);
function checkReminders(){if(!S.setupDone)return;const n=nowP(),day=dayRec(n.key);day.fired=day.fired||{};
 for(const t of day.plan){if(!wantsRemind(t)||day.tasks[t.id]||day.fired[t.id])continue;const st=toMin(t.start);
  if(n.min>=st&&n.min<st+3){day.fired[t.id]=1;save();if(!nativeOK()){chime('warn');buzz();sysNotify(rTitle(t),t.name)}
   if(S.active){toast(rTitle(t)+' ('+t.start+'). Conclua a etapa atual quando puder.');continue}
   openModal(`<span class="label">Lembrete · ${t.start}</span><h2>${esc(rTitle(t))}</h2><p>${esc(t.name)} · ${fmtDur(durOf(day,t))}</p><div class="btns"><button class="btn" data-act="closeModal">Agora não</button><button class="btn primary" data-act="start" data-id="${t.id}">Começar</button></div>`)}}}

/* ---------- loop ---------- */
let lastKey=null,lastMin=null;
setInterval(()=>{if(S.active)updateFocus(false);const n=nowP();
 if(n.min!==lastMin){lastMin=n.min;checkReminders();
  const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!busy&&$('#modal').hidden&&(view==='home'||view==='rotina'||n.key!==lastKey))render();lastKey=n.key}},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(S.active&&!S.active.pausedAt)wakeOn();render();if(S.active&&!$('#focus').hidden)renderFocus()}});

load();lastKey=today();render();if(S.active&&S.setupDone)openFocus();
if(LN&&S.setupDone)nativeInit(false).then(()=>{if(view==='ajustes')render()});
if(NATIVE)document.addEventListener('resume',()=>{render();syncTimerNotifs()});
})();
</script>
